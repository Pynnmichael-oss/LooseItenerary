<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#0f0f0f"/>

  <!-- Compass rose outer ring -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="#c4732a" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="96" cy="96" r="56" fill="none" stroke="#c4732a" stroke-width="0.75" stroke-opacity="0.15"/>

  <!-- Compass cardinal tick marks -->
  <line x1="96" y1="24" x2="96" y2="34" stroke="#c4732a" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="96" y1="158" x2="96" y2="168" stroke="#c4732a" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="24" y1="96" x2="34" y2="96" stroke="#c4732a" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="158" y1="96" x2="168" y2="96" stroke="#c4732a" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Ordinal ticks -->
  <line x1="147" y1="45" x2="141" y2="51" stroke="#c4732a" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="45" y1="45" x2="51" y2="51" stroke="#c4732a" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="45" y1="147" x2="51" y2="141" stroke="#c4732a" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="147" y1="147" x2="141" y2="141" stroke="#c4732a" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- North needle (pointed up, solid accent) -->
  <polygon points="96,38 102,82 96,90 90,82" fill="#c4732a"/>
  <!-- South needle (pointing down, dimmer) -->
  <polygon points="96,154 90,110 96,102 102,110" fill="#c4732a" opacity="0.35"/>

  <!-- Center circle -->
  <circle cx="96" cy="96" r="7" fill="#0f0f0f" stroke="#c4732a" stroke-width="2"/>
  <circle cx="96" cy="96" r="3" fill="#c4732a"/>

  <!-- Monogram "LI" subtle, at bottom -->
  <text x="96" y="178" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#c4732a" opacity="0.5" letter-spacing="3">LI</text>
</svg>
